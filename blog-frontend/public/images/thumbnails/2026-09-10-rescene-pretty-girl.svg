<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032b26" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021c18" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <radialGradient id="glowGrad" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#14b8a6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>

    <!-- Vinyl Center Radial -->
    <radialGradient id="vinylCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowGrad)" />

  <!-- Grid Tech Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Giant Background Hangul Watermark -->
  <text x="1140" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif"
        font-size="140" font-weight="900" fill="#ffffff" opacity="0.04" text-anchor="end">한글 기초</text>

  <!-- Right Visual: Stylized Neon Vinyl & Equalizer -->
  <g transform="translate(980, 315)">
    <!-- Vinyl Grooves -->
    <circle cx="0" cy="0" r="210" fill="#09090b" stroke="#2dd4bf" stroke-width="3" opacity="0.9" />
    <circle cx="0" cy="0" r="185" fill="none" stroke="#27272a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="#27272a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="135" fill="none" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#27272a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.6" />

    <!-- Vinyl Center Label -->
    <circle cx="0" cy="0" r="62" fill="url(#vinylCenter)" stroke="#2dd4bf" stroke-width="2.5" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />

    <!-- Floating Musical Notes -->
    <text x="-160" y="-140" font-family="'Segoe UI', sans-serif" font-size="34" fill="#2dd4bf" opacity="0.75">♫</text>
    <text x="140" y="-120" font-family="'Segoe UI', sans-serif" font-size="28" fill="#14b8a6" opacity="0.8">♬</text>
    <text x="-140" y="150" font-family="'Segoe UI', sans-serif" font-size="30" fill="#2dd4bf" opacity="0.7">♪</text>
  </g>

  <!-- Equalizer Visualizer Spectrum -->
  <g>
    <rect x="960" y="303" width="4" height="24" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="970" y="293" width="4" height="45" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="980" y="276" width="4" height="78" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="990" y="255" width="4" height="120" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1000" y="283" width="4" height="65" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1010" y="268" width="4" height="95" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1020" y="245" width="4" height="140" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1030" y="260" width="4" height="110" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1040" y="275" width="4" height="80" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1050" y="248" width="4" height="135" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1060" y="235" width="4" height="160" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1070" y="270" width="4" height="90" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1080" y="258" width="4" height="115" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1090" y="240" width="4" height="150" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1100" y="278" width="4" height="75" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1110" y="290" width="4" height="50" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1120" y="265" width="4" height="100" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1130" y="273" width="4" height="85" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1140" y="250" width="4" height="130" rx="2" fill="#2dd4bf" opacity="0.85" />
<rect x="1150" y="285" width="4" height="60" rx="2" fill="#2dd4bf" opacity="0.85" />

  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 80)">
    <!-- Badges Row -->
    <g>
      <!-- Difficulty Pill -->
      <rect x="0" y="0" width="210" height="38" rx="19" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5" />
      <text x="105" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="14" font-weight="700" fill="#ccfbf1" text-anchor="middle">🟢 Beginner (Level 1)</text>

      <!-- Chart Source & Rank Pill -->
      <rect x="222" y="0" width="220" height="38" rx="19" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
      <text x="332" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="13" font-weight="700" fill="#fde047" text-anchor="middle">🏆 Melon Top 100 #5</text>
    </g>

    <!-- Artist Subheading -->
    <g transform="translate(0, 82)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="24" font-weight="800" fill="#2dd4bf" letter-spacing="3" text-transform="uppercase">
        RESCENE
      </text>
    </g>

    <!-- Main Song Title -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif"
            font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
        Pretty Girl
      </text>
      
    </g>

    <!-- Subtitle / Hangul and Genre info -->
    <g transform="translate(0, 175)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif"
            font-size="20" font-weight="600" fill="#94a3b8">
        프리티 걸 (Dance &amp; Pop) • Easy Syllables &amp; Catchy Hooks
      </text>
    </g>

    <!-- 3 Core Pedagogy Pillars -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="580" height="52" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="14" font-weight="700" fill="#e2e8f0">
        📝 3-Line Breakdown  •  📚 Core Vocab Table  •  🗣️ Pronunciation Guide
      </text>
    </g>
  </g>

  <!-- Bottom Branding Bar -->
  <g transform="translate(80, 560)">
    <rect width="1040" height="42" rx="10" fill="#09090b" fill-opacity="0.75" stroke="#27272a" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#2dd4bf" />
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="13" font-weight="700" fill="#e4e4e7">
      K-Pop Hangul • Master Korean Lyrics with Melon &amp; Spotify Hits
    </text>
    <text x="1016" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="end">
      kpop-hangul.github.io
    </text>
  </g>
</svg>