<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Modern Vibrant Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    
    <!-- Subtle Inner Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Square Base with Rounded Corners -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Diagram Connecting Lines (White Borders / Circuits) -->
  <!-- Center to Top-Left Node -->
  <line x1="50" y1="50" x2="28" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95" />
  <!-- Center to Top-Right Node -->
  <line x1="50" y1="50" x2="72" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95" />
  <!-- Center to Bottom-Left Node -->
  <line x1="50" y1="50" x2="28" y2="70" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95" />
  <!-- Center to Bottom-Right Node -->
  <line x1="50" y1="50" x2="72" y2="70" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95" />

  <!-- Workflow Automation Loop / Orbital Arc -->
  <path d="M 28 30 A 30 30 0 0 1 72 30" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3" opacity="0.75" />
  <path d="M 72 70 A 30 30 0 0 1 28 70" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3" opacity="0.75" />

  <!-- Central AI Core Node (Hexagon / Processor Core) -->
  <rect x="40" y="40" width="20" height="20" rx="5" fill="#ffffff" />
  <rect x="44" y="44" width="12" height="12" rx="3" fill="#2563eb" />
  <circle cx="50" cy="50" r="2.5" fill="#ffffff" />

  <!-- Outer Satellite Agent Nodes (Harvest, Write, Inspect, Publish) -->
  <!-- Top-Left Agent (Harvest) -->
  <circle cx="28" cy="30" r="7" fill="#1d4ed8" stroke="#ffffff" stroke-width="3" />
  <circle cx="28" cy="30" r="2.5" fill="#ffffff" />

  <!-- Top-Right Agent (Write) -->
  <circle cx="72" cy="30" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="3" />
  <circle cx="72" cy="30" r="2.5" fill="#ffffff" />

  <!-- Bottom-Right Agent (Publish) -->
  <circle cx="72" cy="70" r="7" fill="#4f46e5" stroke="#ffffff" stroke-width="3" />
  <circle cx="72" cy="70" r="2.5" fill="#ffffff" />

  <!-- Bottom-Left Agent (Monitor/Inspect) -->
  <circle cx="28" cy="70" r="7" fill="#1e40af" stroke="#ffffff" stroke-width="3" />
  <circle cx="28" cy="70" r="2.5" fill="#ffffff" />
</svg>
