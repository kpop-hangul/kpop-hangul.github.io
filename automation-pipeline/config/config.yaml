# ==========================================
# 🚀 Auto Blog System Configuration: K-Pop Hangul
# ==========================================

# 1. AI Generation Engine Settings
engine:
  provider: "codex_cli"
  cli_command: "codex"
  timeout_seconds: 900
  image_timeout_seconds: 900

image_agent:
  provider: "codex_image_generation"
  orchestrator_model: "gpt-6-astra"
  effort: "medium"
  required: true
  body_image_count: 2

# 2. Blog Site Metadata
site:
  title: "K-Pop Hangul | Learn Korean with K-Pop Hits"
  description: "Learn Korean vocabulary, grammar, and pronunciation through top charting K-Pop song lyrics from Melon and Spotify."
  author: "K-Pop Hangul Team"
  url: "https://kpop-hangul.github.io"
  default_language: "en"
  theme_color: "#6366f1"

# 3. Monetization & Ads
adsense:
  enabled: true
  publisher_id: "pub-3054784185688248"
  auto_ads: true
  slots:
    top_banner: ""
    in_article_1: ""
    in_article_2: ""
    bottom_banner: ""
    sidebar_banner: ""

# 3-1. Analytics & Verification
analytics:
  ga_id: ""
  naver_verification: ""
  google_verification: ""

# 4. Content Categories & Music Taxonomy
content:
  difficulties:
    - name: "Beginner (Level 1)"
      slug: "beginner"
    - name: "Intermediate (Level 2)"
      slug: "intermediate"
    - name: "Advanced (Level 3)"
      slug: "advanced"
  genres:
    - "Dance & Pop"
    - "R&B & Soul"
    - "Hip-Hop & Rap"
    - "Ballad & OST"
    - "Rock & Band"
    - "Indie & Acoustic"
  
  target_length_words: 1800
  tone_style: "Engaging, encouraging, educational, and structured in clear English"
  include_faq: true
  include_toc: true

# 5. AI Agent Model
agent:
  effort: "high"
  model_name: "gpt-6-astra"
  temperature: 0.7
  max_output_tokens: 8192

# 6. Telegram Bot
telegram:
  enabled: true
  bot_token: ""
  bot_username: "kpop_hangul_bot"
  chat_id: "5017406279"

# 7. Deployment & Paths
github:
  repo_root: "../"
  blog_content_dir: "../blog-frontend/src/content/blog"
  auto_git_commit: true
  auto_git_push: true


review_agent:
  enabled: true
  model_name: "gpt-6-astra"
  effort: "high"

# New requests use the Codex + agy operations queue.
operations:
  legacy_generation_enabled: false
