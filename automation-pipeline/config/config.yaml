# ==========================================
# 🚀 Auto Blog System Configuration (absianp.github.io)
# ==========================================

# 1. AI 생성 엔진 설정 (Google Antigravity CLI / SDK / On-Device 지원)
engine:
  provider: "antigravity_cli" # antigravity_cli | antigravity_sdk | local_ollama | gemini_api
  cli_command: "agy"           # Antigravity CLI 명령어 (agy 또는 antigravity)
  local_model: "gemma2:2b"     # 라즈베리파이 5 온디바이스 모델 (Ollama / LiteRT)
  ollama_url: "http://localhost:11434/v1"

# 2. 블로그 사이트 메타데이터 (도메인 루트)
site:
  title: "앱시안(absian)"
  description: "AI 생산성 도구, 개발 팁, 스마트 부업 및 테크 트렌드 전문 블로그"
  author: "앱시안 (absian)"
  url: "https://absianp.github.io"
  default_language: "ko"
  theme_color: "#2563eb"

# 3. 구글 애드센스 (Google AdSense) 설정
adsense:
  enabled: true
  publisher_id: "ca-pub-3054784185688248" # 구글 애드센스 인증 완료
  auto_ads: true
  slots:
    top_banner: "1234567890"
    in_article_1: "2345678901"
    in_article_2: "3456789012"
    bottom_banner: "4567890123"
    sidebar_banner: "5678901234"

# 3-1. 웹 분석 (GA4) 및 검색엔진 소유권 인증
analytics:
  ga_id: "" # 구글 애널리틱스 4 측정 ID (예: G-XXXXXXXXXX)
  naver_verification: "" # 네이버 서치어드바이저 사이트 확인 메타태그 값


# 4. 콘텐츠 생성 & 타겟 분야 설정
content:
  categories:
    - name: "AI & 생산성"
      slug: "ai-productivity"
      keywords: ["ChatGPT 활용법", "Claude 프롬프트 팁", "AI 이미지 생성", "생산성 노션 템플릿", "무료 AI 툴 추천", "자동화 스크립트"]
    - name: "개발 & 테크"
      slug: "tech-dev"
      keywords: ["파이썬 자동화", "웹 개발 기초", "깃허브 팁", "VS Code 필수 플러그인", "클라우드 무료 티어 활용"]
    - name: "스마트 부업 & 재테크"
      slug: "side-income"
      keywords: ["무자본 디지털 노마드", "블로그 수익화 전략", "애드센스 승인 팁", "노코드 툴 활용 부업"]
  
  target_length_words: 1800
  tone_style: "친절하면서도 전문적이고 명확한 해결책을 제시하는 존댓말 스타일"
  include_faq: true
  include_toc: true

# 5. AI 에이전트 모델 설정
agent:
  model_name: "gemini-2.5-flash"
  temperature: 0.7
  max_output_tokens: 4096

# 6. 사용자 승인 & 모바일 스마트 브리핑 (Telegram Bot)
telegram:
  enabled: true
  bot_token: "" # .env 파일의 TELEGRAM_BOT_TOKEN 에서 자동 로드
  chat_id: ""   # .env 파일의 TELEGRAM_CHAT_ID 에서 자동 로드

# 7. GitHub 및 배포 경로 설정
github:
  repo_root: "../"
  blog_content_dir: "../blog-frontend/src/content/blog"
  auto_git_commit: true
  auto_git_push: true
